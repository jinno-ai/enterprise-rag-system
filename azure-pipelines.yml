trigger:
- main
- develop

pool:
  vmImage: ubuntu-latest

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.10'
  displayName: 'Use Python 3.10'

- script: |
    python -m pip install --upgrade pip
    # Install dependencies individually to handle version conflicts more gracefully
    pip install "pydantic>=2.7.4" "pydantic-settings>=2.1.0"
    pip install "langchain>=0.1.20" "langchain-community>=0.0.38" "langchain-openai>=0.0.5" "langchain-anthropic>=0.1.1"
    pip install "openai>=1.10.0" "anthropic>=0.25.8" "faiss-cpu>=1.8.0" "numpy<2.0.0" "httpx>=0.26.0"
    pip install "pytest>=7.4.3" "pytest-cov>=4.1.0" "pytest-mock>=3.15.1"
  displayName: 'Install dependencies'

- script: |
    export PYTHONPATH=.
    export OPENAI_API_KEY=sk-dummy
    python -m pytest tests/integration/test_rag_integration.py --junitxml=junit/test-results.xml --cov=app --cov-report=xml --cov-report=html
  displayName: 'Run tests'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFiles: '**/test-results.xml'
    testRunTitle: 'Python 3.10'

- task: PublishCodeCoverageResults@2
  inputs:
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
