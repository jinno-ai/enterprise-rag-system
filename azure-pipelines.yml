# UNIFIED ENTERPRISE RAG SYSTEM CI PIPELINE
# Alignment with GitHub Actions using Python 3.10 and ubuntu-latest.

trigger:
- main
- develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  python.version: '3.10'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(python.version)'
  displayName: 'Use Python $(python.version)'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest pytest-azurepipelines pytest-cov
  displayName: 'Install dependencies'

- script: |
    export OPENAI_API_KEY=sk-dummy
    pytest tests/ -v --doctest-modules --junitxml=junit/test-results.xml --cov=app --cov-report=xml --cov-report=html
  displayName: 'Run unit and integration tests'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFiles: '**/test-*.xml'
    testRunTitle: 'Publish test results for Python $(python.version)'
  displayName: 'Publish test results'

- task: PublishCodeCoverageResults@2
  inputs:
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
  displayName: 'Publish code coverage'
