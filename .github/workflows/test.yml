name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock
          # Note: Quoting is required for version specifiers with < or > to avoid shell redirection
          pip install "pydantic>=2.7.4" "pydantic-settings>=2.1.0"
          pip install "langchain==0.1.20" "langchain-community==0.0.38" "langchain-openai==0.0.5" "langchain-anthropic==0.1.1"
          pip install "openai==1.10.0" "anthropic==0.25.8" "faiss-cpu==1.8.0" "numpy<2.0.0" "httpx==0.26.0"
          pip install -r requirements.txt

      - name: Run tests
        env:
          OPENAI_API_KEY: sk-dummy
          PYTHONPATH: .
        run: |
          pytest tests/integration/test_rag_integration.py -v --cov=app
          if [ -d "tests/unit" ]; then
            pytest tests/unit -v --cov=app --cov-append
          fi
