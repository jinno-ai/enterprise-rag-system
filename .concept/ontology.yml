    related_terms: ["EncryptionService", "EmbeddingModel"]
    evidence:
      - source: "app/core/config.py#L13-L17"
        quote: "class Settings(BaseSettings): ... openai_api_key: str = Field(..., env=\"OPENAI_API_KEY\")"

  RetrievalResult:
    id: "TERM-RETRIEVALRESULT"
    layer: "domain"
    status: "stable"
    definition: "検索結果1件の表現。document/score/metadata を持つ。RAGResponse.retrieval_results の要素"
