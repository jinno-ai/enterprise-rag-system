    boundaries:
      includes: ["チャンク生成"]
      excludes: ["RAG オーケストレーション（StreamingRAGPipeline の担当）"]
    related_terms: ["StreamingRAGPipeline"]
    evidence:
      - source: "app/services/streaming.py#L39"
        quote: "class StreamingResponseGenerator:"

  Settings:
    id: "TERM-SETTINGS"
    layer: "core"
    status: "stable"
    definition: "環境変数ベースのアプリケーション設定。OPENAI_API_KEY は必須項目"
    synonyms: ["config"]
    boundaries:
      includes: ["API キー", "検索設定", "埋め込み設定"]
