    related_terms: ["RAGPipeline"]
    evidence:
      - source: "app/services/suggestion.py#L213"
        quote: "class QuerySuggestionService:"

  AutocorrectService:
    id: "TERM-AUTOCORRECTSERVICE"
    layer: "aux"
    status: "draft"
    definition: "クエリの軽量自動修正（スペル等）を提供するサービス"
    synonyms: ["autocorrect"]
    boundaries:
      includes: ["クエリ事前補正"]
      excludes: ["意味検索"]
    related_terms: ["QueryRequest"]
    evidence:
      - source: "app/services/autocorrect.py#L27"
        quote: "class AutocorrectService:"

  MetadataSearchService:
    id: "TERM-METADATASEARCHSERVICE"
    layer: "aux"
    status: "draft"
    definition: "メタデータに対するフィルタ検索（演算子ベース）を提供するサービス"
